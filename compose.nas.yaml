name: bbp-center
services:
  web:
    build: .
    image: bbp-center-nas:local
    container_name: bbp-center
    restart: unless-stopped
    env_file: ./server/.env
    ports:
      - "${NAS_BIND_IP:-127.0.0.1}:${NAS_PORT:-3080}:3001"
    volumes:
      - ./server/data:/opt/bbp/server/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/catalog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
